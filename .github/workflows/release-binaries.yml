# Builds standalone executables with PyInstaller and attaches them to a release.
#   release published -> build and upload to that release
#   manual run        -> build and upload to the given tag (backfill old releases)
#   pull request      -> build and smoke-test only; binaries kept as workflow artifacts
name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to
        required: true
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: claude-use-windows-x64.exe
          # oldest supported runner = oldest glibc = runs on more distros
          - os: ubuntu-22.04
            asset: claude-use-linux-x64.tar.gz
          - os: macos-latest
            asset: claude-use-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pyinstaller

      - name: Build
        run: pyinstaller --onefile --name claude-use --add-data "template.html:." usage_dashboard.py

      # a release must print its own tag, or --version is lying
      - name: Check version
        run: |
          ver=$(dist/claude-use --version)
          echo "$ver"
          if [ -n "$TAG" ] && [ "$ver" != "claude-use ${TAG#v}" ]; then
            echo "::error::tag $TAG but __version__ says '$ver'"; exit 1
          fi

      - name: Smoke test install
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/share
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          mkdir -p ~/.claude/projects
          # --all twice: the second run must change nothing
          dist/claude-use --install --all --data-dir "$RUNNER_TEMP/backup" < /dev/null
          dist/claude-use --install --all < /dev/null
          ~/.local/bin/claude-use --no-open
          test -s "$XDG_CACHE_HOME/claude-use/dashboard.html"
          test -s "$RUNNER_TEMP/backup/usage.sqlite"
          test "$(grep -c -- '--arm-clock' ~/.claude/settings.json)" = 1
          grep -q -- '--statusline' ~/.claude/settings.json
          case "$RUNNER_OS" in
            Windows)
              test -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/Claude Use.lnk"
              reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\claude-use'
              MSYS_NO_PATHCONV=1 schtasks /query /tn "claude-use import" ;;
            Linux)
              cat "$XDG_DATA_HOME/applications/claude-use.desktop"
              if systemctl --user show-environment > /dev/null 2>&1; then
                systemctl --user cat claude-use-import.timer
                systemctl --user is-enabled claude-use-import.timer
              else
                test "$(crontab -l | grep -c 'claude-use import')" = 1
              fi ;;
            macOS)
              cat ~/Library/LaunchAgents/claude-use-import.plist ;;
          esac

      # the cache clock against a fake transcript, last used 5 s ago
      - name: Smoke test cache clock
        run: |
          t="$RUNNER_TEMP/clock.jsonl"
          now=$(python -c "import datetime as d; print((d.datetime.now(d.timezone.utc) - d.timedelta(seconds=5)).isoformat().replace('+00:00', 'Z'))")
          echo "{\"type\":\"assistant\",\"timestamp\":\"$now\",\"cwd\":\"/tmp\",\"message\":{\"model\":\"claude-sonnet-5\",\"id\":\"m1\",\"usage\":{\"input_tokens\":3,\"cache_read_input_tokens\":50000,\"output_tokens\":9}}}" > "$t"
          hook=$(python -c "import json, os, sys; print(json.dumps({'session_id': 'ci-clock', 'transcript_path': os.path.normpath(sys.argv[1])}))" "$t")
          line=$(echo "$hook" | ~/.local/bin/claude-use --statusline)
          echo "$line"; case "$line" in "cache warm until "*) ;; *) exit 1 ;; esac
          echo "$hook" | ~/.local/bin/claude-use --arm-clock
          case "$RUNNER_OS" in
            Windows) MSYS_NO_PATHCONV=1 schtasks /query /tn '\claude-use\clock\ci-clock' ;;
            Linux) systemctl --user list-timers 'claude-use-clock-*' 2>/dev/null | grep -q ci-clock \
                     || test -s ~/.local/state/claude-use/clock/ci-clock.pid ;;
            macOS) test -s ~/.local/state/claude-use/clock/ci-clock.pid ;;
          esac
          echo "$hook" | ~/.local/bin/claude-use --cancel-clock
          case "$RUNNER_OS" in
            Windows) if MSYS_NO_PATHCONV=1 schtasks /query /tn '\claude-use\clock\ci-clock'; then exit 1; fi ;;
            *) test ! -e ~/.local/state/claude-use/clock/ci-clock.pid ;;
          esac

      # uninstall from the installed copy itself: on Windows that's the
      # delete-after-exit path
      - name: Smoke test uninstall
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/share
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          ~/.local/bin/claude-use --uninstall
          for i in $(seq 15); do [ -e ~/.local/bin/claude-use* ] || break; sleep 1; done
          if ls ~/.local/bin/claude-use* 2>/dev/null; then exit 1; fi
          test ! -e "$XDG_CACHE_HOME/claude-use"
          # kept: settings, history, backup
          test -s "$XDG_CONFIG_HOME/claude-use/config.toml"
          test -s "$XDG_DATA_HOME/claude-use/usage.sqlite"
          test -s "$RUNNER_TEMP/backup/usage.sqlite"
          # the clock entries and the import job are gone too
          if grep -q claude-use ~/.claude/settings.json; then exit 1; fi
          case "$RUNNER_OS" in
            Windows)
              test ! -e "$APPDATA/Microsoft/Windows/Start Menu/Programs/Claude Use.lnk"
              if reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\claude-use'; then exit 1; fi
              if MSYS_NO_PATHCONV=1 schtasks /query /tn "claude-use import"; then exit 1; fi ;;
            Linux)
              test ! -e "$XDG_DATA_HOME/applications/claude-use.desktop"
              if systemctl --user cat claude-use-import.timer 2>/dev/null; then exit 1; fi
              if crontab -l 2>/dev/null | grep -q claude-use; then exit 1; fi ;;
            macOS)
              test ! -e ~/Library/LaunchAgents/claude-use-import.plist ;;
          esac

      # tar keeps the executable bit, which a bare download would lose
      - name: Package
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mv dist/claude-use.exe "${{ matrix.asset }}"
          else
            tar -czf "${{ matrix.asset }}" -C dist claude-use
          fi

      - name: Upload to release
        if: env.TAG != ''
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep as workflow artifact
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
