# Builds standalone executables with PyInstaller and attaches them to a release.
#   release published -> build and upload to that release
#   manual run        -> build and upload to the given tag (backfill old releases)
#   pull request      -> build and smoke-test only; binaries kept as workflow artifacts
name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to
        required: true
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: claude-use-windows-x64.exe
          # oldest supported runner = oldest glibc = runs on more distros
          - os: ubuntu-22.04
            asset: claude-use-linux-x64.tar.gz
          - os: macos-latest
            asset: claude-use-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pyinstaller

      - name: Build
        # the icon is built into the Windows exe; Linux --install copies the PNG out
        run: |
          icon=(); [ "$RUNNER_OS" = Windows ] && icon=(--icon assets/icon.ico)
          pyinstaller --onefile --name claude-use "${icon[@]}" --add-data "template.html:." \
            --add-data "assets/icon.png:assets" usage_dashboard.py

      # a release must print its own tag, or --version is lying
      - name: Check version
        run: |
          ver=$(dist/claude-use --version)
          echo "$ver"
          if [ -n "$TAG" ] && [ "$ver" != "claude-use ${TAG#v}" ]; then
            echo "::error::tag $TAG but __version__ says '$ver'"; exit 1
          fi

      # the runner context isn't available in job-level env, so set them here
      - name: Paths
        run: |
          for d in CONFIG:config DATA:share CACHE:cache STATE:state; do
            echo "XDG_${d%%:*}_HOME=$RUNNER_TEMP/${d#*:}" >> "$GITHUB_ENV"
          done
          if [ "$RUNNER_OS" = Windows ]; then
            echo "EXE=$(cygpath -u "$LOCALAPPDATA")/Programs/claude-use/claude-use.exe" >> "$GITHUB_ENV"
          else
            echo "EXE=$HOME/.local/bin/claude-use" >> "$GITHUB_ENV"
          fi

      - name: Smoke test install
        run: |
          mkdir -p ~/.claude/projects
          # 2.x leftovers that --install must remove: the clock's status line
          # and hook and, on Windows, the import task and the exe in its old place
          echo '{"statusLine":{"type":"command","command":"\"/old/claude-use\" --statusline"},"hooks":{"Stop":[{"hooks":[{"type":"command","command":"\"/old/claude-use\" --arm-clock"}]}]}}' > ~/.claude/settings.json
          if [ "$RUNNER_OS" = Windows ]; then
            MSYS_NO_PATHCONV=1 schtasks /create /tn "claude-use import" /tr "cmd /c exit" /sc daily /st 12:00 /f
            mkdir -p ~/.local/bin && cp dist/claude-use.exe ~/.local/bin/
          fi
          # --all twice: the second run must change nothing
          dist/claude-use --install --all --data-dir "$RUNNER_TEMP/backup" < /dev/null
          dist/claude-use --install --all < /dev/null
          "$EXE" --no-open
          test -s "$XDG_CACHE_HOME/claude-use/dashboard.html"
          test -s "$RUNNER_TEMP/backup/usage.sqlite"
          # one hook, though installed twice; the 2.x entries gone
          test "$(grep -c -- '--auto-import' ~/.claude/settings.json)" = 1
          grep -q '"SessionStart"' ~/.claude/settings.json
          if grep -q -e '--arm-clock' -e '--statusline' ~/.claude/settings.json; then exit 1; fi
          case "$RUNNER_OS" in
            Windows)
              test -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/Claude Use.lnk"
              reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\claude-use'
              if MSYS_NO_PATHCONV=1 schtasks /query /tn "claude-use import"; then exit 1; fi
              test ! -e ~/.local/bin/claude-use.exe
              # on the user PATH once, though installed twice
              test "$(MSYS_NO_PATHCONV=1 reg query 'HKCU\Environment' /v Path | grep -o -F 'Programs\claude-use' | wc -l)" = 1 ;;
            Linux)
              cat "$XDG_DATA_HOME/applications/claude-use.desktop"
              grep -qx 'Icon=claude-use' "$XDG_DATA_HOME/applications/claude-use.desktop"
              cmp assets/icon.png "$XDG_DATA_HOME/icons/hicolor/256x256/apps/claude-use.png" ;;
          esac

      # the hook as Claude Code runs it: a new transcript must land in the DB,
      # with nothing printed (SessionStart output can reach Claude's context)
      - name: Smoke test auto-import
        run: |
          mkdir -p ~/.claude/projects/ci
          echo '{"type":"assistant","requestId":"ci-r1","timestamp":"2026-01-01T00:00:00Z","cwd":"/tmp","message":{"model":"claude-sonnet-5","id":"m1","usage":{"input_tokens":3,"output_tokens":9}}}' > ~/.claude/projects/ci/t.jsonl
          cmd=$(python -c "import json, os; s = json.load(open(os.path.expanduser('~/.claude/settings.json'))); print(s['hooks']['SessionStart'][-1]['hooks'][0]['command'])")
          out=$(echo '{"hook_event_name":"SessionStart"}' | bash -c "$cmd" 2>&1)
          test -z "$out"
          python -c 'import os, sqlite3, sys; db = os.path.join(os.environ["XDG_DATA_HOME"], "claude-use", "usage.sqlite"); sys.exit(not sqlite3.connect(db).execute("select 1 from messages where key = ?", ("ci-r1:m1",)).fetchone())'
          # 2.x entries not yet removed must stay quiet
          for f in --statusline --arm-clock --cancel-clock; do test -z "$(echo '{}' | "$EXE" $f 2>&1)"; done

      # uninstall from the installed copy itself: on Windows that's the
      # delete-after-exit path
      - name: Smoke test uninstall
        run: |
          "$EXE" --uninstall
          # Windows: the folder goes too, after the exe
          gone="$EXE"; [ "$RUNNER_OS" = Windows ] && gone=$(dirname "$EXE")
          for i in $(seq 15); do [ -e "$gone" ] || break; sleep 1; done
          test ! -e "$gone"
          test ! -e "$XDG_CACHE_HOME/claude-use"
          test ! -e "$XDG_STATE_HOME/claude-use"
          # kept: settings, history, backup
          test -s "$XDG_CONFIG_HOME/claude-use/config.toml"
          test -s "$XDG_DATA_HOME/claude-use/usage.sqlite"
          test -s "$RUNNER_TEMP/backup/usage.sqlite"
          if grep -q claude-use ~/.claude/settings.json; then exit 1; fi
          case "$RUNNER_OS" in
            Windows)
              test ! -e "$APPDATA/Microsoft/Windows/Start Menu/Programs/Claude Use.lnk"
              if reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\claude-use'; then exit 1; fi
              if MSYS_NO_PATHCONV=1 reg query 'HKCU\Environment' /v Path | grep -q -F 'Programs\claude-use'; then exit 1; fi ;;
            Linux)
              test ! -e "$XDG_DATA_HOME/applications/claude-use.desktop"
              test ! -e "$XDG_DATA_HOME/icons/hicolor/256x256/apps/claude-use.png" ;;
          esac

      # tar keeps the executable bit, which a bare download would lose
      - name: Package
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mv dist/claude-use.exe "${{ matrix.asset }}"
          else
            tar -czf "${{ matrix.asset }}" -C dist claude-use
          fi

      - name: Upload to release
        if: env.TAG != ''
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep as workflow artifact
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
